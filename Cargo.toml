[package]
name = "tilcayo"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A damage-aware framebuffer presentation pipeline for the Kitty graphics protocol"
license = "MIT"
repository = "https://github.com/pgavlin/tilcayo"
keywords = ["kitty", "terminal", "graphics", "framebuffer"]
categories = ["graphics", "command-line-interface"]

[dependencies]
base64 = "0.22"
crossterm = { package = "crossterm-tilcayo", version = "=0.29.0-tilcayo.1", features = ["terminal-queries"] }
flate2 = "1"
libc = "0.2"
